<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cours de Torah du Rav Yaacov B. Harrar</title>
  <meta name="description" content="Les cours de Torah du Rav Yaacov B. Harrar : paracha, Guemara daf par daf, fêtes, prière, éducation. En français et en hébreu.">
  <meta name="theme-color" content="#14213d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/home.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const th = localStorage.getItem('rh.theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" href="#/" aria-label="Accueil">
        <span class="brand__mark" aria-hidden="true">
          <img src="assets/rav.jpg" alt="" onerror="this.remove()">
          <span class="brand__monogram">י</span>
        </span>
        <span class="brand__names">
          <span class="brand__fr">Rav Yaacov B. Harrar</span>
          <span class="brand__he" lang="he" dir="rtl">הרב יעקב ב. חרר</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Navigation">
        <a href="#/" data-route="home" data-i18n="nav.home">Accueil</a>
        <a href="#/library" data-route="library" data-i18n="nav.library">Tous les cours</a>
        <a href="#/gemara" data-route="gemara" data-i18n="nav.gemara">Guemara</a>
        <a href="#/parasha" data-route="parasha" data-i18n="nav.parasha">Paracha</a>
        <a href="#/topics" data-route="topics" data-i18n="nav.topics">Fêtes et sujets</a>
      </nav>
      <div class="tools">
        <button class="tool tool--lang" id="lang-toggle" type="button" lang="he">עברית</button>
        <button class="tool" id="theme-toggle" type="button" aria-label="Changer le thème clair / sombre">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A5.5 5.5 0 0 1 13.4 3.1 9 9 0 0 0 12 3Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading" role="status">
      <div class="skeleton skeleton--hero"></div>
      <div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__about" data-i18n="footer.about">Les cours du Rav Yaacov B. Harrar, publiés sur sa chaîne YouTube.</p>
      <ul class="footer__links">
        <li><a id="link-youtube" href="https://www.youtube.com/@ravyaacovb.harrar4468" target="_blank" rel="noopener" data-i18n="footer.youtube">Chaîne YouTube</a></li>
        <li><a id="link-facebook" href="https://www.facebook.com/yaacov1" target="_blank" rel="noopener" data-i18n="footer.facebook">Facebook</a></li>
        <li id="whatsapp-item" hidden><a id="link-whatsapp" href="#" target="_blank" rel="noopener" data-i18n="footer.whatsapp">WhatsApp</a></li>
      </ul>
    </div>
  </footer>

  <!-- One persistent player: full overlay on #/lesson/<id>, mini card while browsing. -->
  <section class="player" id="player" hidden aria-labelledby="player-title">
    <div class="player__backdrop" data-player="minimize"></div>
    <div class="player__box">
      <div class="player__frame"><div id="yt-player"></div></div>
      <div class="player__bar">
        <div class="player__meta">
          <p class="player__kicker" id="player-kicker"></p>
          <h2 class="player__title" id="player-title" dir="auto"></h2>
        </div>
        <div class="player__actions">
          <a class="icon-btn" id="player-youtube" href="#" target="_blank" rel="noopener" aria-label="YouTube">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3ZM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
          </a>
          <button class="icon-btn" type="button" data-player="toggle" id="player-toggle" aria-label="Agrandir">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h7v2H7.4l4.3 4.3-1.4 1.4L6 7.4V11H4V4Zm16 16h-7v-2h3.6l-4.3-4.3 1.4-1.4 4.3 4.3V13h2v7Z"/></svg>
          </button>
          <button class="icon-btn" type="button" data-player="close" id="player-close" aria-label="Fermer">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
